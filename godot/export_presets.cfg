[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="wechat"
export_filter="all_resources"
include_filter="assets/chars/manifest.json,assets/troops/manifest.json,config/*.json,config/moves/*.json"
exclude_filter="tools/*, build/*, *.md, *.txt, config/schema/*, assets/bg/hulaoguan_sky.png, assets/bg/hulaoguan_parallax.json, assets/ui/vignette.png, assets/ui/banner.png, assets/ui/bar_bg.png, assets/ui/bar_fill_p1.png, assets/ui/bar_fill_p2.png, assets/ui/bar_stamina.png, assets/ui/bar_ult.png, assets/ui/ring.png, assets/ui/spark.png"
export_path="../build_web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
