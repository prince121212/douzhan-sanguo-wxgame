<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>斗战三国 · 数值控制台</title>
<style>
  :root{
    --bg:#14100d; --panel:#1d1714; --panel2:#241c18; --line:#3a2d25;
    --gold:#e8b75c; --gold-dim:#8a6d3b; --text:#e6dccb; --muted:#9a8b78;
    --ok:#5fce7a; --warn:#e8a33d; --err:#e85c4a; --blue:#5aa9e6;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#1d1714 0%,#191310 100%);
    border-bottom:1px solid var(--line);
    padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  h1{font-size:19px; margin:0; color:var(--gold); font-weight:600; letter-spacing:.5px}
  .sub{color:var(--muted); font-size:12.5px}
  .grow{flex:1}
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 10px; border-radius:20px; font-size:12px;
    background:#241c18; border:1px solid var(--line); color:var(--muted);
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#5a4a3c}
  .badge.on .dot{background:var(--ok); box-shadow:0 0 6px var(--ok)}
  button{
    font:inherit; cursor:pointer; border-radius:6px; padding:8px 16px;
    border:1px solid var(--line); background:#2a211c; color:var(--text);
    transition:.15s;
  }
  button:hover:not(:disabled){background:#332822; border-color:var(--gold-dim)}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.primary{background:#3d2a12; border-color:var(--gold-dim); color:var(--gold); font-weight:600}
  button.primary:hover:not(:disabled){background:#4d3517; border-color:var(--gold)}
  button.danger{color:#f0a090}

  main{padding:18px 20px 120px; max-width:1400px; margin:0 auto}

  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap}
  .tab{
    padding:8px 16px; border-radius:6px 6px 0 0; cursor:pointer;
    background:#1b1512; border:1px solid var(--line); border-bottom:none;
    color:var(--muted); font-size:13.5px;
  }
  .tab.active{background:var(--panel); color:var(--gold); border-color:var(--gold-dim)}
  .tab .cnt{font-size:11px; opacity:.6; margin-left:4px}

  .searchbar{display:flex; gap:10px; margin-bottom:14px; align-items:center}
  input[type=search]{
    flex:1; max-width:420px; padding:8px 12px; border-radius:6px;
    border:1px solid var(--line); background:#1b1512; color:var(--text); font:inherit;
  }
  input[type=search]:focus{outline:none; border-color:var(--gold-dim)}

  section{background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:14px; overflow:hidden}
  section>h2{
    margin:0; padding:11px 16px; font-size:14px; font-weight:600;
    background:var(--panel2); color:var(--gold); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;
  }
  section>h2 .arrow{font-size:10px; color:var(--muted); transition:.15s}
  section.collapsed>h2 .arrow{transform:rotate(-90deg)}
  section.collapsed .rows{display:none}
  section>h2 .hint{font-weight:400; font-size:12px; color:var(--muted); margin-left:auto}

  .row{
    display:grid; grid-template-columns:340px 130px 1fr; gap:14px;
    align-items:start; padding:9px 16px; border-bottom:1px solid #241c18;
  }
  .row > input[type=number], .row > input[type=range], .row > .no-slider{margin-top:6px}
  .row:last-child{border-bottom:none}
  .row:hover{background:#221a16}
  .row.changed{background:#2a2110}
  .row.changed .name{color:var(--gold)}
  .name{color:#ddd2c2}
  .name .note{display:block; font-size:11.5px; line-height:1.45; color:#8a7a68; margin-top:3px; max-width:280px}
  .name .path{display:block; font-size:11px; color:#6b5c4c; font-family:ui-monospace,monospace}
  .row input[type=number]{
    width:100%; padding:6px 9px; border-radius:5px; text-align:right;
    border:1px solid var(--line); background:#120e0b; color:var(--text);
    font:inherit; font-variant-numeric:tabular-nums;
  }
  .row input[type=number]:focus{outline:none; border-color:var(--gold); background:#1a1410}
  .row input[type=number]:disabled{opacity:.45; cursor:not-allowed}
  .row input[type=range]{width:100%; accent-color:var(--gold); cursor:pointer}
  .row input[type=range]:disabled{opacity:.35; cursor:not-allowed}
  .no-slider{color:#4a3d33; font-size:12px}

  footer{
    position:fixed; bottom:0; left:0; right:0; z-index:60;
    background:linear-gradient(180deg,#1d1714ee,#191310);
    border-top:1px solid var(--line); padding:11px 20px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .status{flex:1; font-size:13px; color:var(--muted); min-width:220px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.warn{color:var(--warn)}

  dialog{
    border:1px solid var(--gold-dim); border-radius:10px; background:var(--panel);
    color:var(--text); padding:0; max-width:820px; width:92vw; max-height:80vh;
  }
  dialog::backdrop{background:#000b}
  dialog .dhead{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px}
  dialog .dhead h3{margin:0; font-size:16px; color:var(--gold)}
  dialog pre{
    margin:0; padding:16px 18px; overflow:auto; max-height:56vh;
    font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap; word-break:break-all;
  }
  dialog .dfoot{padding:12px 18px; border-top:1px solid var(--line); text-align:right}

  .toast{
    position:fixed; top:70px; right:20px; z-index:200;
    padding:12px 18px; border-radius:8px; max-width:420px;
    background:#241c18; border:1px solid var(--line); box-shadow:0 8px 30px #000a;
    opacity:0; transform:translateY(-8px); transition:.2s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:none}
  .toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
</style>
</head>
<body>

<header>
  <h1>数值控制台</h1>
  <span class="sub">改数值 → 保存 → 重新构建 → 微信开发者工具自动刷新</span>
  <span class="grow"></span>
  <span class="badge" id="badge-godot"><span class="dot"></span>Godot 编辑器</span>
  <span class="badge" id="badge-ide"><span class="dot"></span>微信开发者工具</span>
  <button id="btn-reload">重新载入</button>
</header>

<main>
  <div class="tabs" id="tabs"></div>
  <div class="searchbar">
    <input type="search" id="search" placeholder="搜索字段名 / 路径 / 武将名（如 parry、关羽、unhorse）">
    <span class="sub" id="search-info"></span>
  </div>
  <div id="content"></div>
</main>

<footer>
  <span class="status" id="status">载入中…</span>
  <button class="danger" id="btn-revert" disabled>还原全部改动</button>
  <button class="primary" id="btn-save" disabled>保 存</button>
  <button id="btn-rebuild">重新构建</button>
</footer>

<dialog id="dlg">
  <div class="dhead">
    <h3 id="dlg-title">输出</h3>
    <span class="grow"></span>
    <button id="dlg-close">关闭</button>
  </div>
  <pre id="dlg-body"></pre>
</dialog>

<div class="toast" id="toast"></div>

<script>
const S = { configs:{}, schemas:{}, meta:{}, changes:{}, tab:'balance', filter:'', expanded:new Set() };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------------- 数据访问 ----------------
function getByPath(obj, dotted){
  let cur = obj;
  for (const p of dotted.split('.')){
    if (cur && typeof cur === 'object' && p in cur) cur = cur[p];
    else return undefined;
  }
  return cur;
}
function isNum(v){ return typeof v === 'number' && isFinite(v); }

// ---------------- 生成行定义 ----------------
// 每行：{file, path, label, desc, value, rng, isInt, group}
function buildRows(){
  const rows = [];
  const bal = S.configs['balance.json'] || {};
  const balSchema = (S.schemas['balance'] || {}).properties || {};
  const secNames = {round:'一局规则', hp:'体力 / 耐力', rage:'怒气（绝技槽）',
                    damage:'伤害计算', ai_difficulty:'AI 难度曲线'};
  for (const sec of ['round','hp','rage','damage','ai_difficulty']){
    const sp = balSchema[sec]; if (!sp) continue;
    const sub = sp.properties || {};
    for (const key of Object.keys(sub)){
      const spec = sub[key], path = sec + '.' + key;
      const cur = getByPath(bal, path);
      const desc = spec.description || '';
      const shortLabel = spec.label || key;
      if (spec.type === 'array' && Array.isArray(cur)){
        cur.forEach((v,i) => rows.push({
          file:'balance.json', path: path + '.' + i,
          label: shortLabel + ' · 第' + (i+1) + '档',
          desc: desc + '（依次对应：易 / 中 / 难 / 极）',
          value: v, rng: spec.range || [], isInt:false,
          group: 'balance:' + sec, secName: secNames[sec] || sec
        }));
      } else if (isNum(cur)){
        rows.push({ file:'balance.json', path, label: shortLabel, desc,
          value: cur, rng: spec.range || [],
          isInt: Number.isInteger(cur) && (spec.type === 'integer'),
          group:'balance:'+sec, secName: secNames[sec] || sec });
      }
    }
  }

  rows.push(...buildProgressionRows());

  const chars = (S.configs['characters.json'] || {}).characters || {};
  const order = (S.configs['characters.json'] || {}).order || Object.keys(chars);
  const chSchema = (((S.schemas['characters'] || {}).definitions || {}).character || {});
  const chProps = chSchema.properties || {};
  for (const id of order){
    const c = chars[id]; if (!c) continue;
    const g = 'char:' + id;
    const nm = c.name || id;
    const add = (path, label, rng, isInt, note) => {
      const v = getByPath(c, path);
      if (!isNum(v)) return;
      rows.push({file:'characters.json', path:'characters.'+id+'.'+path,
        label, desc:note||'', value:v, rng:rng||[], isInt:!!isInt,
        group:g, secName: nm + ' · ' + (c.epithet||''), charId:id, charName:nm});
    };

    add('hp','体力上限',[800,2200],true,
      '血量。被打光就输。数值越高越耐打，但会让一局拖得更长。参考区间 1200~1450。');

    add('size','立绘缩放',[0.8,1.3],false,
      '只影响外观大小，不影响任何判定。1.0 是标准身高；想让某位武将显得魁梧就调大（如吕布 1.06）。');

    add('stats.wu','武力',[60,100],true,
      '决定「攻击力」。伤害 = 招式基础伤害 × 武力系数 × 对方统率系数。' +
      '系数 = 0.62 + 武力/260：武力 60→0.85 倍，100→1.00 倍。' +
      '注意：这一项影响的是「所有招式」的整体伤害，想单独加强某一招请改 config/moves。');

    add('stats.tong','统率',[60,100],true,
      '决定「减伤」。系数 = 1.0 - (统率-60)/420：统率 60→受伤 100%，100→受伤约 90%。' +
      '数值越高越抗揍。和武力是同一套乘算，两者会互相抵消。');

    add('stats.su','速度',[60,100],true,
      '决定「移动速度」。系数 = 0.86 + 速度/700：速度 60→0.95 倍，100→1.00 倍。' +
      '只影响走位和追击/逃跑，不影响出招快慢（出招帧数在 config/moves 里）。');

    add('stats.dan','胆识',[60,100],true,
      '目前【还没有接入任何逻辑】，改了不起作用。留作以后扩展用。');

    add('ai.aggression','进攻欲望',[0,1],false,
      'AI 主动进攻的倾向。越高越爱抢攻、越少等待；同时也会提高「拼刀」和「拆招反击」的意愿。' +
      '张飞 0.86（猛攻型）· 关羽 0.50（沉稳型）。');

    add('ai.patience','耐心',[0,1],false,
      'AI 愿意等待、游斗、格挡的程度。越高越会拉开距离找机会、越少硬拼；' +
      '也会影响「血量低时是否转为防守」。注意它和 aggression 是互相拉扯的。');

    add('ai.parry','拆招能力',[0,1],false,
      'AI 在对手出手的瞬间按下格挡（=拆招）的成功率。越高越难打中它。' +
      '实际成功率还会乘以难度系数（易 0.25 / 中 0.55 / 难 0.85 / 极 1.05）。' +
      '0.8 已经很强了，别轻易给满。');

    add('ai.dodge','闪避倾向',[0,1],false,
      'AI 遇到攻击时选择「闪避」而不是格挡的概率，也影响它躲箭的意愿。' +
      '注意闪避要消耗耐力，所以数值过高会让 AI 很快没耐力。');

    add('ai.combo','连招倾向',[0,1],false,
      'AI 打连招的意愿：越高越容易连续出招（而不是打一下就退）。' +
      '高连招 + 高进攻 = 压制型打法；低连招更适合打反击。');

    add('ai.jump','跳跃倾向',[0,1],false,
      'AI 用跳跃来躲攻击、躲箭的概率。跳跃有滞空破绽，所以别给太高。' +
      '数值只影响「选择跳」的权重，不改变跳跃本身的手感。');

    add('ai.feint','诈败倾向',[0,1],false,
      'AI 假装后退、引诱对手追击、再回身反打的概率。关羽这类「拖刀计」角色给高值。' +
      '太高会显得滑不留手，太低则缺少戏剧性。');

    add('ai.zone','控场/远程倾向',[0,1],false,
      'AI 拉开距离、用远程或长兵器控场的倾向。0 = 完全贴身打；' +
      '大于 0 会明显降低主动进攻权重。黄忠这类弓手才需要调高，近战角色保持 0。');

    add('ai.honor','武德（下马相陪）',[0,1],false,
      '对手被打落马时，AI 是否也下马步战（而不是骑马欺负人）的概率。' +
      '纯演出/人设，不影响胜负平衡。关羽 0.9（重武德）· 张飞 0.45。');

    add('ai.taunt','喊话频率',[0,1],false,
      'AI 战斗中说台词（嘲讽/喊话）的频率。纯表现，不影响战斗。' +
      '台词内容在 characters.json 的 lines 里。');
  }
  return rows;
}

// ---------------- 成长系统（progression.json） ----------------
// 直接从 schema 递归生成：对象 → 逐项；数组 → 逐项；数字 → 一行。
// 这样以后新增字段（比如再加一个段位）控制台自动出现，不用改这里。
function buildProgressionRows(){
  const out = [];
  const data = S.configs['progression.json'] || {};
  const schema = S.schemas['progression'] || {};
  if (!data || !schema.properties) return out;

  const secNames = {
    'score': '评分规则',
    'score.weights': '评分 · 五项权重',
    'score.skill': '评分 · 技术分细则',
    'score.grades': '评分 · 评价档位（分数线）',
    'medals': '奖章奖励',
    'medals.by_grade_difficulty': '奖章 · 每场奖励（评价 × 难度）',
    'rank': '段位',
    'rank.ranks': '段位 · 晋级门槛',
    'rank.difficulty_gate': '段位 · 难度门槛',
    'rank.decay': '段位 · 掉段机制',
    'unlocks': '解锁',
    'unlocks.characters': '解锁 · 武将价格',
    'titles': '称号',
  };

  const walk = (obj, spec, prefix, pathPrefix, groupKey) => {
    if (!spec) return;
    if (spec.type === 'object'){
      const props = spec.properties || {};
      // additionalProperties 的字典（如 奖章表 / 武将价格）：按实际键遍历
      if (Object.keys(props).length === 0 && spec.additionalProperties && obj && typeof obj === 'object'){
        for (const k of Object.keys(obj)){
          if (k.startsWith('_')) continue;
          walk(obj[k], spec.additionalProperties, prefix ? prefix + '.' + k : k, pathPrefix ? pathPrefix + '.' + k : k, groupKey);
        }
        return;
      }
      for (const k of Object.keys(props)){
        if (k.startsWith('_')) continue;
        const v = obj ? obj[k] : undefined;
        const p = prefix ? prefix + '.' + k : k;
        const gp = pathPrefix ? pathPrefix + '.' + k : k;
        if (v === undefined) continue;
        walk(v, props[k], p, gp, groupKey || k);
      }
      return;
    }
    if (spec.type === 'array'){
      const items = spec.items || {};
      const arr = Array.isArray(obj) ? obj : [];
      arr.forEach((v, i) => {
        if (items.type === 'object'){
          const nm = (v && (v.name || v.id)) ? String(v.name || v.id) : ('#' + (i+1));
          const props = items.properties || {};
          for (const k of Object.keys(props)){
            if (k.startsWith('_')) continue;
            const iv = v[k];
            if (!isNum(iv)) continue;
            const isp = props[k];
            out.push({
              file:'progression.json',
              path: pathPrefix + '.' + i + '.' + k,
              label: nm + ' · ' + (isp.label || isp.description || k),
              desc: (isp.description || ''),
              value: iv, rng: isp.range || [],
              isInt: isp.type === 'integer',
              group: 'prog:' + pathPrefix,
            secName: pathPrefix === 'medals.by_grade_difficulty'
              ? ('奖章 · ' + pathPrefix.split('.')[1] + ' 评价')
              : (secNames[pathPrefix] || pathPrefix)
            });
          }
        } else if (isNum(v)){
          const isp = items;
          const DIFFS = ['易', '中', '难', '极'];
          const isMedal = pathPrefix.startsWith('medals.by_grade_difficulty');
          out.push({
            file:'progression.json',
            path: pathPrefix + '.' + i,
            label: isMedal ? ('难度 · ' + (DIFFS[i] || ('第' + (i+1) + '档'))) : ((isp.label || '第') + (i+1) + ' 项'),
            desc: (isp.description || '') + (isMedal ? '（依次对应：易 / 中 / 难 / 极）' : ''),
            value: v, rng: isp.range || [],
            isInt: isp.type === 'integer',
            group: 'prog:' + pathPrefix,
            secName: isMedal
              ? ('奖章 · ' + pathPrefix.split('.').pop() + ' 评价')
              : (secNames[pathPrefix] || pathPrefix)
          });
        }
      });
      return;
    }
    // 数字
    if (isNum(obj)){
      out.push({
        file:'progression.json', path: pathPrefix,
        label: spec.label || spec.description || pathPrefix,
        desc: spec.description || '',
        value: obj, rng: spec.range || [],
        isInt: spec.type === 'integer',
        group: 'prog:' + (groupKey || pathPrefix), secName: secNames[groupKey] || groupKey || pathPrefix
      });
    }
  };

  // 顶层：score / medals / rank 逐节；titles 单独一节
  for (const sec of ['score','medals','rank','unlocks']){
    if (data[sec] !== undefined && schema.properties[sec]){
      walk(data[sec], schema.properties[sec], sec, sec, sec);
    }
  }
  if (Array.isArray(data.titles)){
    walk(data.titles, schema.properties.titles, 'titles', 'titles', 'titles');
  }
  return out;
}

// ---------------- 渲染 ----------------
function currentRows(){
  if (!S._rows) S._rows = buildRows();
  return S._rows;
}

function changeKey(file, path){ return file + '|' + path; }

function render(){
  const rows = currentRows();
  const filter = S.filter.trim().toLowerCase();

  // tabs
  const tabsEl = $('#tabs');
  const counts = {};
  rows.forEach(r => counts[r.group] = (counts[r.group]||0)+1);
  let tabsHtml = '';
  tabsHtml += `<div class="tab ${S.tab==='balance'?'active':''}" data-tab="balance">全局平衡<span class="cnt">${Object.keys(counts).filter(k=>k.startsWith('balance:')).reduce((a,k)=>a+counts[k],0)}</span></div>`;
  tabsHtml += `<div class="tab ${S.tab==='chars'?'active':''}" data-tab="chars">武将<span class="cnt">${Object.keys(counts).filter(k=>k.startsWith('char:')).reduce((a,k)=>a+counts[k],0)}</span></div>`;
  tabsHtml += `<div class="tab ${S.tab==='prog'?'active':''}" data-tab="prog">成长 / 段位<span class="cnt">${Object.keys(counts).filter(k=>k.startsWith('prog:')).reduce((a,k)=>a+counts[k],0)}</span></div>`;
  tabsEl.innerHTML = tabsHtml;
  tabsEl.querySelectorAll('.tab').forEach(el => el.onclick = () => {
    S.tab = el.dataset.tab; render();
  });

  // 过滤
  let shown = rows.filter(r => {
    if (S.tab === 'balance' && !r.group.startsWith('balance:')) return false;
    if (S.tab === 'chars' && !r.group.startsWith('char:')) return false;
    if (S.tab === 'prog' && !r.group.startsWith('prog:')) return false;
    if (!filter) return true;
    return (r.label + ' ' + r.path + ' ' + (r.secName||'') + ' ' + (r.charName||''))
      .toLowerCase().includes(filter);
  });

  $('#search-info').textContent = filter ? `匹配 ${shown.length} 项` : '';

  // 分组
  const groups = new Map();
  shown.forEach(r => {
    if (!groups.has(r.group)) groups.set(r.group, {name: r.secName || r.group, rows: []});
    groups.get(r.group).rows.push(r);
  });

  let html = '';
  for (const [g, info] of groups){
    const collapsed = S.expanded.has(g) ? '' : 'collapsed';
    html += `<section class="${collapsed}" data-group="${esc(g)}"><h2><span class="arrow">▼</span>${esc(info.name)}<span class="hint">${info.rows.length} 项</span></h2><div class="rows">`;
    for (const r of info.rows){
      const key = changeKey(r.file, r.path);
      const changed = key in S.changes;
      const val = changed ? S.changes[key] : r.value;
      const hasSlider = r.rng.length >= 2 && r.rng[1] <= 1 && r.rng[0] >= 0;
      html += `<div class="row ${changed?'changed':''}" data-key="${esc(key)}">
        <div class="name">${esc(r.label||r.path)}${r.desc?`<span class="note">${esc(r.desc)}</span>`:''}<span class="path">${esc(r.path)}</span></div>
        <input type="number" step="${r.isInt?1:0.01}" value="${val}" data-file="${esc(r.file)}" data-path="${esc(r.path)}" data-int="${r.isInt?1:0}">
        ${hasSlider
          ? `<input type="range" min="${r.rng[0]}" max="${r.rng[1]}" step="0.01" value="${val}" data-range-for="${esc(key)}">`
          : `<span class="no-slider">—</span>`}
      </div>`;
    }
    html += '</div></section>';
  }
  if (!html) html = '<section><div class="row"><span class="sub">没有匹配的字段</span></div></section>';
  $('#content').innerHTML = html;

  // 折叠：记住展开过哪些组，重渲染后保持
  document.querySelectorAll('section > h2').forEach(h => {
    h.onclick = () => {
      const sec = h.parentElement;
      sec.classList.toggle('collapsed');
      const g = sec.dataset.group;
      if (sec.classList.contains('collapsed')) S.expanded.delete(g);
      else S.expanded.add(g);
    };
  });

  // 输入事件
  document.querySelectorAll('input[type=number]').forEach(inp => {
    inp.oninput = () => {
      const file = inp.dataset.file, path = inp.dataset.path, isInt = inp.dataset.int === '1';
      let v = parseFloat(inp.value);
      if (!isFinite(v)) return;
      if (isInt) v = Math.round(v);
      const key = changeKey(file, path);
      const orig = getByPath(S.configs[file], path);
      if (Math.abs(v - orig) < 1e-9) delete S.changes[key];
      else S.changes[key] = v;
      inp.closest('.row').classList.toggle('changed', key in S.changes);
      const rg = document.querySelector(`input[data-range-for="${CSS.escape(key)}"]`);
      if (rg) rg.value = v;
      updateFooter();
    };
  });
  document.querySelectorAll('input[type=range]').forEach(rg => {
    rg.oninput = () => {
      const key = rg.dataset.rangeFor;
      const [file, path] = key.split('|');
      const v = parseFloat(rg.value);
      const inp = document.querySelector(`input[type=number][data-file="${CSS.escape(file)}"][data-path="${CSS.escape(path)}"]`);
      if (inp) inp.value = v;
      const orig = getByPath(S.configs[file], path);
      if (Math.abs(v - orig) < 1e-9) delete S.changes[key];
      else S.changes[key] = v;
      rg.closest('.row').classList.toggle('changed', key in S.changes);
      updateFooter();
    };
  });

  updateFooter();
}

function updateFooter(){
  const n = Object.keys(S.changes).length;
  $('#btn-save').disabled = n === 0;
  $('#btn-revert').disabled = n === 0;
  if (n === 0){
    setStatus('没有改动。', '');
  } else {
    setStatus(`有 ${n} 处改动待保存。`, 'warn');
  }
}

function setStatus(text, cls){
  const el = $('#status');
  el.textContent = text;
  el.className = 'status ' + (cls||'');
}

function toast(msg, cls){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + (cls||'');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast ' + (cls||''), 3600);
}

// ---------------- 动作 ----------------
async function loadState(){
  setStatus('载入中…','');
  try{
    const r = await fetch('/api/state', {cache:'no-store'});
    const d = await r.json();
    S.configs = d.configs; S.schemas = d.schemas; S.meta = d.meta;
    S._rows = null; S.changes = {}; S.expanded.clear();
    updateBadges();
    render();
  }catch(e){
    setStatus('载入失败: ' + e, 'err');
  }
}

function updateBadges(){
  $('#badge-godot').classList.toggle('on', !!S.meta.godot_running);
  $('#badge-ide').classList.toggle('on', !!S.meta.ide_running);
}

async function save(){
  const n = Object.keys(S.changes).length;
  if (!n) return;
  const byFile = {};
  for (const key in S.changes){
    const [file, path] = key.split('|');
    if (!byFile[file]) byFile[file] = {};
    byFile[file][path] = S.changes[key];
  }
  $('#btn-save').disabled = true;
  setStatus('保存中（会先跑配置校验）…','');
  try{
    const r = await fetch('/api/save', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({changes: byFile})
    });
    const d = await r.json();
    if (d.ok){
      toast(`已保存 ${n} 处改动，校验通过`, 'ok');
      await loadState();
      setStatus('已保存。点「重新构建」让微信开发者工具生效。','ok');
    } else {
      setStatus('保存失败：' + d.error, 'err');
      showDialog('保存失败', (d.detail || d.error || ''));
      await loadState();
    }
  }catch(e){
    setStatus('保存失败: ' + e, 'err');
  }
  updateFooter();
}

function revertAll(){
  S.changes = {};
  render();
  toast('已还原全部改动', '');
}

let rebuildTimer = null;
async function rebuild(){
  $('#btn-rebuild').disabled = true;
  setStatus('构建中…','');
  try{
    await fetch('/api/rebuild', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    pollRebuild();
  }catch(e){
    setStatus('构建请求失败: ' + e, 'err');
    $('#btn-rebuild').disabled = false;
  }
}

async function pollRebuild(){
  try{
    const r = await fetch('/api/rebuild', {cache:'no-store'});
    const j = await r.json();
    if (j.state === 'running'){
      setStatus(`构建中… ${Math.round(j.elapsed||0)}s`, '');
      rebuildTimer = setTimeout(pollRebuild, 800);
      return;
    }
    $('#btn-rebuild').disabled = false;
    if (j.state === 'done'){
      setStatus('✅ 构建完成，微信开发者工具会自动刷新。','ok');
      showDialog('构建完成', j.log || '');
      toast('构建完成', 'ok');
    } else if (j.state === 'failed'){
      setStatus('❌ 构建失败，看输出。','err');
      showDialog('构建失败', j.log || '');
    } else {
      setStatus('空闲。','');
    }
  }catch(e){
    $('#btn-rebuild').disabled = false;
  }
}

function showDialog(title, body){
  $('#dlg-title').textContent = title;
  $('#dlg-body').textContent = body;
  $('#dlg').showModal();
}

// ---------------- 绑定 ----------------
$('#btn-reload').onclick = loadState;
$('#btn-save').onclick = save;
$('#btn-revert').onclick = revertAll;
$('#btn-rebuild').onclick = rebuild;
$('#dlg-close').onclick = () => $('#dlg').close();
$('#search').oninput = e => { S.filter = e.target.value; render(); };

document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key === 's'){ e.preventDefault(); if (!$('#btn-save').disabled) save(); }
});

loadState();
setInterval(updateBadges, 4000);
</script>
</body>
</html>
